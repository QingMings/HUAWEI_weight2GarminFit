name: 构建 Windows 安装包

# 推 v* 标签时自动构建并发布 Release；也可以手动跑一次只出 artifact
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: desktop/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 解包 adb / scrcpy
        shell: pwsh
        run: |
          if (-not (Test-Path desktop/vendor/scrcpy-win64-v2.0/adb.exe)) {
            Expand-Archive -Path scrcpy-win64-v2.0.zip -DestinationPath desktop/vendor -Force
          }

      - name: 回归测试
        run: python -m unittest discover -s tests -t tests

      - name: 读取版本号
        shell: pwsh
        run: |
          $ver = (Select-String -Path desktop/installer.iss -Pattern 'MyAppVersion "([\d.]+)"').Matches[0].Groups[1].Value
          "APP_VERSION=$ver" >> $env:GITHUB_ENV
          Write-Host "版本 $ver"

      - name: 打包 exe 与安装包
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File ./build.ps1 -SkipTests

      - name: 生成绿色版压缩包
        shell: pwsh
        run: |
          Compress-Archive -Path dist/GarminWeightHelper/* `
            -DestinationPath "dist/GarminWeightHelper_v$($env:APP_VERSION)_portable.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: GarminWeightHelper-v${{ env.APP_VERSION }}
          if-no-files-found: error
          path: |
            dist/佳明体重助手_v*_安装包.exe
            dist/GarminWeightHelper_v*_portable.zip

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/佳明体重助手_v*_安装包.exe
            dist/GarminWeightHelper_v*_portable.zip
          generate_release_notes: true
